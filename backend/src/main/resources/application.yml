spring:
  application:
    name: traffic-fine-system
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:traffic_fine_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-that-must-be-at-least-256-bits-long-for-hs256}
    expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: INFO
    com.slpolice.trafficfine: DEBUG

notifylk:
  enabled: ${NOTIFYLK_ENABLED:true}
  endpoint: ${NOTIFYLK_ENDPOINT:https://app.notify.lk/api/v1/send}
  user-id: ${NOTIFYLK_USER_ID:32484}
  api-key: ${NOTIFYLK_API_KEY:ux8ONhJAyp6AaRyfgO2f}
  sender-id: ${NOTIFYLK_SENDER_ID:NotifyDEMO}